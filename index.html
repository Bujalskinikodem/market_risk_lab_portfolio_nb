<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>PwC Market Risk Lab | Nikodem Bujalski</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      padding: 40px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #111;
    }

    .subtitle {
      font-size: 18px;
      color: #555;
      margin-bottom: 35px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .card {
      display: block;
      padding: 24px;
      border: 1px solid #ddd;
      border-left: 6px solid #d04a02;
      border-radius: 14px;
      text-decoration: none;
      color: #222;
      transition: 0.2s ease;
      background: #fff;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      border-color: #d04a02;
    }

    .card h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .footer {
      margin-top: 35px;
      font-size: 14px;
      color: #777;
    }

    @media (max-width: 768px) {
      .container {
        margin: 25px 14px;
        padding: 26px;
      }

      h1 {
        font-size: 30px;
      }

      .subtitle {
        font-size: 16px;
      }

      .card {
        padding: 20px;
      }

      .card h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>PwC Market Risk Lab</h1>

    <p class="subtitle">
      Portfolio raportów analitycznych przygotowanych w ramach programu PwC Market Risk Lab.
    </p>

    <div class="grid">

      <a class="card" href="przygotowanie_danych.html">
        <h2>1. Przygotowanie i eksploracja danych rynkowych</h2>
      </a>

      <a class="card" href="value_at_risk.html">
        <h2>2. Value at Risk</h2>
      </a>

      <a class="card" href="opcje.html">
        <h2>3. Wycena opcji</h2>
      </a>

    </div>

    <div class="footer">
      Raporty przygotowano w R Markdown / HTML.
    </div>
  </div>

</body>
</html>
